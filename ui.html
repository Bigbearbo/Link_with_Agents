<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>三方討論</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
:root{
  --bg:#f4f2ee; --panel:#ffffff; --ink:#1d1b18; --muted:#7a756d; --line:#e4e0d8;
  --me:#2f6fde; --me-bg:#e8f0fd; --claude:#c8643b; --claude-bg:#fbefe8; --codex:#0f9a74; --codex-bg:#e6f5f0; --gemini:#4f6bed; --nvidia:#76b900; --deepseek:#4d6bfe;
  --sys:#8a857c; --sys-bg:#efede8; --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.04);
  --font:"Segoe UI","Microsoft JhengHei UI","Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#17171a; --panel:#202024; --ink:#ecebe8; --muted:#9a968f; --line:#2f2f35;
  --me:#7aa7ff; --me-bg:#1f2a40; --claude:#f0956b; --claude-bg:#3a261d; --codex:#4fd1a7; --codex-bg:#16332b; --gemini:#8fa2ff; --nvidia:#9ad62a; --deepseek:#8aa0ff;
  --sys:#9a968f; --sys-bg:#26262b; --shadow:none; color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--font);display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--line)}
.rooms{display:flex;gap:6px;padding:8px 20px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto}
.rooms button{border-radius:999px;padding:4px 14px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.rooms button.sel{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.rooms .badge{width:7px;height:7px;border-radius:50%;background:var(--codex);display:inline-block}
.rooms .badge.ap{background:var(--claude)}
.rooms .pagebtn{background:var(--sys-bg)}.rooms .spacer{flex:1}
.rooms .new{font-size:11px;background:var(--me);color:#fff;border-radius:999px;padding:0 6px}
header h1{font-size:17px;margin:0;font-weight:650;letter-spacing:.02em}
.faces{display:flex;gap:4px}
.face{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff}
.f-me{background:var(--me)}.f-claude{background:var(--claude)}.f-codex{background:var(--codex)}.f-gemini{background:var(--gemini)}.f-nvidia{background:var(--nvidia)}.f-deepseek{background:var(--deepseek)}
.spacer{flex:1}
.pill{font-size:12.5px;padding:4px 10px;border-radius:999px;background:var(--sys-bg);color:var(--muted);white-space:nowrap}
.pill.on{color:var(--codex)} .pill.warn{color:var(--claude)}
.pill.busy{color:var(--ink)} .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:currentColor;margin-right:6px;vertical-align:1px}
.pill.busy .dot{animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}
main{flex:1;overflow-y:auto;padding:20px 16px 8px}
.wrap{max-width:860px;margin:0 auto}
.msg{display:flex;gap:10px;margin:0 0 14px;align-items:flex-start}
.msg .face{flex:none;width:32px;height:32px;font-size:13px;margin-top:2px}
.body{min-width:0;max-width:calc(100% - 42px)}
.meta{font-size:12.5px;color:var(--muted);margin:0 0 3px 2px}
.meta b{font-weight:650;margin-right:6px}
.bubble h1,.bubble h2,.bubble h3,.bubble h4{font-size:1.02em;margin:.5em 0 .3em;font-weight:650}  /* 訊息裡的標題不要放大（輝達貼程式時 # 註解被當成大標題） */
.bubble{background:var(--panel);border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:9px 14px;box-shadow:var(--shadow);overflow-wrap:anywhere}
.m-me{flex-direction:row-reverse}.m-me .meta{text-align:right}.m-me .bubble{background:var(--me-bg);border-color:transparent;border-radius:14px 4px 14px 14px}
.m-claude .bubble{border-left:3px solid var(--claude)} .m-claude .meta b{color:var(--claude)}
.m-codex .bubble{border-left:3px solid var(--codex)} .m-codex .meta b{color:var(--codex)}
.m-gemini .bubble{border-left:3px solid var(--gemini)} .m-gemini .meta b{color:var(--gemini)}
.m-nvidia .bubble{border-left:3px solid var(--nvidia)} .m-nvidia .meta b{color:var(--nvidia)}
.m-deepseek .bubble{border-left:3px solid var(--deepseek)} .m-deepseek .meta b{color:var(--deepseek)}
.m-me .meta b{color:var(--me)}
.m-sys{justify-content:center}.m-sys .bubble{background:transparent;border:none;box-shadow:none;color:var(--sys);font-size:13px;padding:2px 8px;text-align:center}
.m-sys .sf{display:inline-block;max-width:100%;text-align:center}
.m-sys .sf summary{cursor:pointer;list-style:none;display:inline-block;padding:2px 10px;border-radius:999px;background:var(--sys-bg);color:var(--sys);font-size:12.5px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;user-select:none;vertical-align:middle}
.m-sys .sf summary::-webkit-details-marker{display:none}
.m-sys .sf summary::before{content:"▶";display:inline-block;margin-right:6px;font-size:10px;opacity:.75;transition:transform .15s}
.m-sys .sf[open] summary::before{transform:rotate(90deg)}
.m-sys .sf-body{margin:6px auto 0;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);text-align:left;max-width:680px;font-size:12.5px;line-height:1.5}
.m-sys .sf-batch+.sf-batch{margin-top:6px;padding-top:6px;border-top:1px dashed var(--line)}
.m-sys .sf-time{color:var(--muted);font-size:11.5px;margin-bottom:2px}
.bubble p{margin:.35em 0}.bubble>:first-child{margin-top:0}.bubble>:last-child{margin-bottom:0}
.bubble pre{background:var(--sys-bg);padding:10px;border-radius:8px;overflow-x:auto;font-size:13px}
.bubble code{font-family:Consolas,"Cascadia Mono",monospace;font-size:.92em;background:var(--sys-bg);padding:1px 5px;border-radius:4px}
.bubble pre code{background:none;padding:0}
.bubble table{border-collapse:collapse;display:block;overflow-x:auto}.bubble td,.bubble th{border:1px solid var(--line);padding:4px 8px}
.bubble ul,.bubble ol{padding-left:1.4em;margin:.35em 0}
.empty{text-align:center;color:var(--muted);margin-top:18vh}
.older{text-align:center;color:var(--muted);font-size:12.5px;margin:0 0 14px}
.empty .big{font-size:20px;color:var(--ink);margin-bottom:6px}
.thinking{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:13.5px;margin:4px 0 14px}
.live:empty{display:none}
.live{margin-top:6px;font-size:12.5px;color:var(--muted)}
.pbar{height:4px;border-radius:999px;background:var(--line);overflow:hidden;margin-bottom:5px}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--codex),var(--me));transition:width .8s}
.m-claude .pbar i{background:linear-gradient(90deg,var(--claude),var(--me))}
.ptext{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-me .bubble:has(+ .live){}
.msg.note .bubble{background:transparent;border:1px dashed var(--me)}
.f-other{background:#8a63d2}.m-other .bubble{border-left:3px solid #8a63d2}.m-other .meta b{color:#8a63d2}
.tag{font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--sys-bg);color:var(--ink);margin-right:6px}
.thinking .face{width:32px;height:32px;flex:none}
.tbody{min-width:0;padding-top:5px}
.steps{list-style:none;margin:6px 0 0;padding:6px 10px;border-left:2px solid var(--line);font-size:12.5px;font-family:Consolas,"Cascadia Mono",var(--font)}
.steps li{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.6}
.steps li:last-child{opacity:1;color:var(--ink)}
.queued{margin-top:6px;font-size:12.5px;color:var(--me)}
.dots{display:inline-flex;gap:3px;margin-right:8px;vertical-align:2px}
.dots i{width:5px;height:5px;border-radius:50%;background:currentColor;animation:pulse 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
footer{background:var(--panel);border-top:1px solid var(--line);padding:10px 16px 14px}
.composer{max-width:860px;margin:0 auto}
.tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:none;border-radius:0;background:transparent}
.seg button.sel{background:var(--ink);color:var(--panel)}
.seg button.skip{padding:0 6px;font-size:11px;color:var(--muted);border-left:1px dashed var(--line);min-width:0}
.seg button.skip{background:rgba(46,158,107,.16);color:#1f7a52;font-weight:600}
#target.solo-mode button.skip{opacity:.35}
/* 小 AI：往右浮出，不擠原橫條；窄畫面改往上 */
#smallWrap{position:relative;display:inline-flex}
#smallBtns{position:absolute;left:calc(100% + 4px);top:0;z-index:60;display:flex;white-space:nowrap;background:var(--panel);box-shadow:var(--shadow)}
#smallBtns[hidden]{display:none}
#smallBtns .smi{display:inline-flex}
@media (max-width:900px){#smallBtns{left:0;top:auto;bottom:calc(100% + 4px);flex-direction:column}}
/* 只問按鈕的用量警示：底線顏色＝那位的額度狀況（只提示，不擋） */
#target button.risk1{box-shadow:inset 0 -3px 0 #d99a1e}
#target button.risk2{box-shadow:inset 0 -3px 0 #d9483b;color:#d9483b}
#target button.sel.risk2{color:var(--panel)}  /* 選「只問 X」時群名單不生效，只是保留勾選 */
.seg button.skip.off{background:rgba(128,128,128,.14);color:var(--muted);text-decoration:line-through;font-weight:400}
@media (prefers-color-scheme:dark){.seg button.skip{background:rgba(79,209,167,.18);color:#7fe0bd}.seg button.skip.off{background:rgba(255,255,255,.06);color:var(--muted)}}
button{font:inherit;font-size:13px;padding:5px 11px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);cursor:pointer}
button:hover{filter:brightness(.96)} button:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;align-items:flex-end}
textarea{flex:1;resize:none;font:inherit;font-size:15px;line-height:1.5;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);min-height:46px;max-height:40vh;outline:none}
textarea:focus{border-color:var(--me)}
.send{background:var(--me);color:#fff;border:none;border-radius:12px;padding:0 18px;height:46px;font-size:15px;font-weight:600}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
select{font:inherit;font-size:13px;padding:4px 6px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}
.switch{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);cursor:pointer;user-select:none}
.switch input{display:none}
.track{width:34px;height:19px;border-radius:999px;background:var(--line);position:relative;transition:.15s}
.track::after{content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.switch input:checked+.track{background:var(--claude)}
.switch input:checked+.track::after{left:17px}
.switch.rw{color:var(--claude);font-weight:600}
.approval{border:1px solid var(--claude);background:var(--claude-bg);border-radius:12px;padding:10px 14px;margin-bottom:10px}
.approval ul{margin:6px 0 8px;padding-left:1.2em;font-family:Consolas,"Cascadia Mono",var(--font);font-size:13px;overflow-wrap:anywhere}
.ap-btns{display:flex;gap:8px}
.ap-btns .allow{background:var(--claude);color:#fff;border-color:transparent;font-weight:600}
@media (max-width:600px){header{flex-wrap:wrap}.hint{display:none}}
/* ---- 側邊用量表 ---- */
#usage{position:fixed;right:16px;top:118px;width:250px;max-height:calc(100vh - 140px);overflow-y:auto;
  background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:12.5px;z-index:5;
  box-shadow:0 2px 10px rgba(0,0,0,.05)}
#usage h3{margin:0 0 8px;font-size:13px;font-weight:650;display:flex;justify-content:space-between;align-items:baseline}
#usage h3 small{color:var(--muted);font-weight:400}
.u-agent{padding:8px 0;border-top:1px solid var(--line)}
.u-agent:first-of-type{border-top:0}
.u-name{display:flex;align-items:center;gap:6px;font-weight:600;margin-bottom:4px}
.u-name .face{width:18px;height:18px;font-size:10px}
.u-name small{margin-left:auto;color:var(--muted);font-weight:400}
.u-win{margin:5px 0}
.u-row{display:flex;justify-content:space-between;color:var(--muted)}
.u-row b{color:var(--ink);font-weight:600}
.u-bar{position:relative;height:7px;border-radius:4px;background:var(--line);margin:3px 0 1px;overflow:visible}
.u-fill{height:100%;border-radius:4px;background:#2e9e6b}
.u-fill.warn{background:#d99a1e}.u-fill.hot{background:#d9483b}
.u-tick{position:absolute;top:-3px;width:2px;height:13px;background:var(--ink);opacity:.55;border-radius:1px}
.u-goal{position:absolute;top:-4px;width:0;height:15px;border-left:2px dashed var(--codex);opacity:.9}
.u-verdict{color:var(--muted);margin-top:3px;line-height:1.4}
.u-verdict.hot{color:#d9483b}
.u-stale{color:#d99a1e}
.u-legend{color:var(--muted);font-size:11.5px;margin-top:8px;line-height:1.4}
#usageBtn{cursor:pointer}
#updBtn{cursor:pointer;background:#2f6fde;color:#fff;border-color:#2f6fde;font-weight:600;animation:updPulse 2s ease-in-out infinite}
@keyframes updPulse{50%{opacity:.6}}
@media (max-width:1379px){#usage{display:none;right:12px;top:64px}#usage.open{display:block}}
@media (min-width:1380px){#usageBtn{display:none}}
/* 書籤（使用者 11-19 22:01）：左邊列表、點了跳過去、可刪；每則發言左上角有加書籤按鈕 */
#marks{position:fixed;left:16px;top:118px;width:230px;max-height:calc(100vh - 140px);overflow-y:auto;
  background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:12.5px;z-index:5;
  box-shadow:0 2px 10px rgba(0,0,0,.05)}
#roomSide{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--line)}
#roomSide .rs-h{font-weight:700;font-size:13px;margin-bottom:2px}
#roomSide button{text-align:left;font:inherit;font-size:13px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:6px 10px;cursor:pointer;display:flex;align-items:center;gap:6px}
#roomSide button:hover{background:var(--sys-bg)}
#roomSide button.sel{background:var(--ink);color:var(--panel);border-color:var(--ink)}
#roomSide .badge{width:7px;height:7px;border-radius:50%;background:var(--codex);display:inline-block}
#roomSide .badge.ap{background:var(--claude)}
#roomSide .new{font-size:11px;background:var(--me);color:#fff;border-radius:999px;padding:0 6px;margin-left:auto}
#roomSide .rs-add{justify-content:center;border-style:dashed;color:var(--me);font-weight:650}
#marksTools{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
#marksTools button{font:inherit;font-weight:650;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:3px 6px;cursor:pointer}
#marksTools button[aria-expanded="true"]{background:var(--sys-bg);border-color:var(--muted)}
#marksList:not([hidden]){margin-top:8px}
#marks [hidden]{display:none}
#marks .mk{display:flex;gap:6px;align-items:flex-start;padding:6px 4px;border-radius:8px;cursor:pointer}
#marks .mk:hover{background:var(--sys-bg)}
#marks .mk .t{flex:1;min-width:0}
#marks .mk .w{color:var(--muted);font-size:11.5px}
#marks .mk .x{flex:none;border:none;background:none;color:var(--muted);cursor:pointer;padding:0 2px;font-size:13px}
#marks .mk .x:hover{color:var(--claude)}
#marks .none{color:var(--muted)}
#marksBtn{cursor:pointer}
#pcPresence{border-top:1px solid var(--line);margin-top:8px;padding-top:6px;font-size:12px;line-height:1.5}
#pcPresence label{cursor:pointer;font-weight:650}#pcMode{border:0;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:2px 7px}#pcMode legend{padding:0;font-weight:650}#pcMode label{white-space:nowrap}#pcSchedule{margin-top:3px}
#pcPresenceStatus{color:var(--muted);overflow-wrap:anywhere;margin-top:2px}
#resourcePanel{border-top:1px solid var(--line);margin-top:8px;padding-top:6px}
#resourceBody{font-size:12px;line-height:1.65;min-width:min(184px,70vw);padding-top:5px}
#resourceBody .res-time{color:var(--muted);font-size:11px}
#resourceFields{border:0;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:4px 8px}
#resourceFields legend{padding:0;margin-bottom:3px;color:var(--muted)}
#resourceFields label,.resourceMode{white-space:nowrap}
#resourcePanel :is(button,select){font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:5px}
#resourceMeter{display:block;width:100%;height:8px;margin-top:6px;accent-color:var(--me)}
#resourceMeter[hidden]{display:none}
#resourcePreview{white-space:pre-wrap;overflow-wrap:anywhere;max-height:160px;overflow-y:auto;margin:6px 0}
@media (max-width:1379px){#marks{display:none;left:12px;top:64px}#marks.open{display:block}}
@media (min-width:1380px){#marksBtn{display:none}}
.lcol{display:flex;flex-direction:column;align-items:center;gap:4px;flex:none}
.abbrBtn{border:1px solid var(--line);background:none;color:var(--muted);border-radius:6px;font-size:10px;padding:1px 3px;cursor:pointer;opacity:.6;max-width:42px;white-space:normal;overflow-wrap:anywhere}
.msg:hover .abbrBtn,.abbrBtn.on{opacity:1}
.abbrBox{margin-top:4px;padding:6px 8px;border:1px dashed var(--line);border-radius:8px;font-size:13px}
.abbrHd{display:flex;justify-content:space-between;gap:8px;margin-bottom:4px;flex-wrap:wrap}.abbrClose{font-size:11px;padding:0 6px;cursor:pointer;margin-left:auto}.abbrHd label{color:var(--muted);font-size:12px}.abbrClose{font-size:11px;padding:0 6px;cursor:pointer}
.abbrRow{margin:3px 0}.abbrRow.hid{opacity:.5}.abbrRow button{font-size:11px;padding:0 6px;margin-left:4px;cursor:pointer}
.bm{border:none;background:none;cursor:pointer;padding:0 4px 0 0;font-size:12px;opacity:.35;vertical-align:1px}
.msg:hover .bm{opacity:.8}.bm.on{opacity:1}
.oldctx{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.oldctx .box{background:var(--bg);color:var(--ink);border-radius:12px;max-width:900px;width:100%;max-height:88vh;display:flex;flex-direction:column;overflow:hidden}
.oldctx .hd{display:flex;gap:8px;align-items:center;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.oldctx .hd .x{margin-left:auto}
.oldctx .bd{overflow:auto;padding:12px}
.msg.hit .bubble{outline:2px solid var(--me);outline-offset:2px}
.msg.flash .bubble{outline:2px solid var(--me);outline-offset:2px;transition:outline-color 1.5s}
:root{--sidew:560px}
#sidePane{position:fixed;right:0;top:56px;bottom:0;width:min(var(--sidew),100vw);background:var(--panel);border-left:1px solid var(--line);
  z-index:20;display:flex;flex-direction:column;box-shadow:-4px 0 16px rgba(0,0,0,.08)}
#sidePane[hidden]{display:none}
#sidePane .side-tabs{display:flex;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line);align-items:center}
#sidePane .side-tabs button{border-radius:999px;padding:3px 12px}
#sidePane .side-tabs button.sel{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.sideFrame{flex:1;border:0;width:100%;background:var(--bg)}.sideFrame[hidden]{display:none}
@media (min-width:1100px){body.side-open main,body.side-open footer{margin-right:var(--sidew)}body.side-open #usage{display:none}}
/* 使用者 11-20 01:10：拉中間的條調寬度；⤢ 放大成整頁（左邊聊天縮掉） */
#sideGrip{position:absolute;left:-4px;top:0;bottom:0;width:8px;cursor:col-resize;z-index:21}
#sideGrip:hover,#sideGrip.drag{background:var(--me);opacity:.35}
body.side-max #sidePane{width:100vw}body.side-max main,body.side-max footer,body.side-max #marks{display:none}
body.dragging iframe{pointer-events:none}body.dragging{user-select:none;cursor:col-resize}

<body>
<header>
  <div class="faces"><div class="face f-me">你</div><div class="face f-claude">C</div><div class="face f-codex">X</div><div class="face f-gemini">G</div><div class="face f-nvidia">N</div><div class="face f-deepseek">D</div></div>
  <h1>三方討論</h1>

</header>
<div id="pagebar" hidden></div>
<nav id="rooms" class="rooms"></nav>
<main id="main"><div class="wrap" id="list"></div></main>
<aside id="usage"><h3>大家的用量 <small id="usageTime"></small></h3><div id="usageList">載入中…</div>
<div class="u-legend">色條＝已用；黑線＝時間窗已過多少。色條超過黑線＝用得比時間快。</div></aside>
<aside id="sidePane" hidden><div id="sideGrip" title="拖曳調整寬度"></div><div class="side-tabs"><button data-p="decide">待討論</button><button data-p="research">研究</button><button data-p="changes">變動</button><button data-p="settings">設定</button><button data-p="board">訊息版</button>

</aside>
<aside id="marks" aria-label="書籤列">
  <div id="marksTools">
    <button type="button" id="marksMin" aria-controls="marksList" aria-expanded="true">🔖 書籤</button>
    <button type="button" id="pcPresenceBtn" aria-controls="pcPresence" aria-expanded="false">電腦模式</button>

  <fieldset id="pcMode" disabled><legend>電腦使用方式</legend><label><input type="radio" name="pcMode" value="auto"> 自動</label><label><input type="radio" name="pcMode" value="game"> 打遊戲</label><label><input type="radio" name="pcMode" value="daily"> 日常</label><label><input type="radio" name="pcMode" value="web"> 只用網頁</label><label><input type="radio" name="pcMode" value="away"> 不用電腦</label></fieldset>
  <div id="pcPresenceStatus" role="status">讀取狀態中。</div><div id="pcSchedule"></div>
</div><section id="resourcePanel" aria-labelledby="resourcesBtn" hidden>
  <div id="resourceBody">
    <fieldset id="resourceFields"><legend>系統資源</legend>
      <label><input type="checkbox" value="cpu" checked> CPU</label>

      <select id="resourceMode"><option value="latest">最新摘要</option><option value="history">近期快照</option></select>

<footer><div class="composer">
  <div id="approval" class="approval" hidden>
    <div class="ap-title">🔐 <b id="apWho"></b> 想做一件跟安全有關的事，需要你同意：</div>
    <ul id="apItems"></ul>
    <div class="ap-btns"><button class="allow" id="apAllow">允許一次</button><button class="allow" id="apAlways" hidden title="這個資料夾以後都可以寫，不再問">以後都允許</button><button id="apDeny">拒絕</button></div>
  </div>
  <div class="tools">
    <span class="seg" id="target">
      <button data-t="both" class="sel">問大家</button><button data-t="claude">只問 Claude</button><button data-t="codex">只問 Codex</button><button data-t="gemini">只問 Gemini</button><button data-t="nvidia">只問 輝達</button><button data-t="deepseek" title="付費（便宜），Claude 管">只問 DeepSeek</button><button data-t="dot" title="Dot 不即時在線：會留點名單，它巡檢時才回">只問 Dot</button><button data-t="note" title="只存進討論，不叫醒任何人；下次叫他們時會一起看到">只記下</button>
    </span>
    <!-- 使用者 11-20 04:47：小 AI 按鈕往右浮出、不佔原橫條；每家附「群／略」 -->
    <span id="smallWrap"><button id="smallToggle" title="免費池的小 AI：點名叫出來試試（使用者 11-20 04:35）">小AI ▸</button><span id="smallBtns" class="seg" hidden><span class="smi"><button class="sm" data-n="groq">groq</button></span><span class="smi"><button class="sm" data-n="cloudflare">cloudflare</button></span><span class="smi"><button class="sm" data-n="nvidia" title="NVIDIA NIM（和「輝達」OpenCode 是不同通道）">nvidia NIM</button></span><span class="smi"><button class="sm" data-n="cohere">cohere</button></span><span class="smi"><button class="sm" data-n="google">google</button></span></span></span>
    <button id="order" title="切換誰先發言">Claude 先講</button>
    <span class="spacer"></span>
    <button id="more">讓他們繼續討論</button>
    <select id="rounds" title="輪數"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select>

    <button id="new">新討論</button>

  </div>

    <button class="send" id="send">送出</button>
  </div>
  <div class="hint">每個 Telegram 群組是一個獨立的房間：這裡打的字只進目前這個房間，也只轉貼到這個房間的群組。</div>
</div></footer>
<script>
const KEY = new URLSearchParams(location.search).get("k") || "";
const $ = s => document.querySelector(s);
const list = $("#list"), main = $("#main"), box = $("#box");
let total = 0, epoch = 0, target = "both", busy = false, confirmNew = 0;
let room = new URLSearchParams(location.search).get("room") || (()=>{ try{ return localStorage.getItem("rt-room") || "main"; }catch(e){ return "main"; } })();
const seenTotals = {};
function switchRoom(id){
  if(id === room) return;
  room = id; total = 0; epoch = 0; list.innerHTML = "";
  try{ localStorage.setItem("rt-room", id); }catch(e){}
  $("#approval").hidden = true; $("#approval").dataset.id = "";
  poll();
}
let lastRooms = null, attn = {decide: 0, research: 0};
function renderRooms(rooms){ lastRooms = rooms;
  const nav = $("#rooms");
  nav.hidden = false;
  nav.innerHTML = "";
  // #319（使用者 11-25 04:23）：房間改放左欄，像聊天程式；上方這條只留頁面按鈕
  let side = $("#roomSide");
  const wide = window.innerWidth >= 1380;   // 窄螢幕左欄（書籤列）是收起來的 → 房間照舊放上方
  if(!side && $("#marks") && wide){ side = document.createElement("div"); side.id = "roomSide"; $("#marks").prepend(side); }
  if(side && !wide){ side.remove(); side = null; }
  if(side){ side.innerHTML = '<div class="rs-h">💬 聊天室</div>'; }
  for(const r of rooms){
    const b = document.createElement("button");
    if(r.id === room) seenTotals[r.id] = r.total;
    const unread = r.id !== room && seenTotals[r.id] !== undefined && r.total > seenTotals[r.id];
    if(seenTotals[r.id] === undefined) seenTotals[r.id] = r.total;
    b.className = r.id === room ? "sel" : "";
    // 使用者 11-20 03:29：「新」加數字
    b.innerHTML = `${r.busy ? '<span class="badge"></span>' : ""}${r.approval ? '<span class="badge ap"></span>' : ""}${esc(r.name)}${unread ? `<span class="new">新 ${Math.min(r.total - seenTotals[r.id], 99)}${r.total - seenTotals[r.id] > 99 ? "+" : ""}</span>` : ""}`;
    b.title = r.linked ? "已連到 Telegram" : "沒有連到 Telegram";
    b.onclick = () => switchRoom(r.id);
    (side || nav).appendChild(b);
  }
  if(side){
    const add = document.createElement("button"); add.className = "rs-add"; add.textContent = "＋ 開新房";
    add.title = "開一間專題房（不用 Telegram 群組）";
    add.onclick = async () => {
      const name = prompt("房名（例：算力經濟）："); if(!name || !name.trim()) return;
      const pack = prompt("資訊包路徑（可留空，例 H:\\Agent共用\\專題房\\算力經濟\\資訊包.md）：") || "";
      const goal = prompt("這次要決定什麼？（可留空）") || "";
      const res = await fetch("/api/newroom", {method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({name: name.trim(), pack, goal, who: "使用者"})}).then(x => x.json()).catch(() => ({ok:false}));
      if(res.ok){ switchRoom(res.id); } else alert("開房失敗：" + (res.error || "中樞沒回應（可能要重啟中樞才有這個功能）"));
    };
    side.appendChild(add);
  }
  // 使用者 11-20 00:54：待討論／研究／變動跟房間放同一條，點了在右側面板切換
  const gap = document.createElement("span"); gap.className = "spacer"; nav.appendChild(gap);
  // Codex 01:37 補漏：四頁各自的圖示；另加「本房設定」直接定位到這個房間那一列
  for(const [p, label, ic] of [["decide", "待討論", "🗳️"], ["research", "研究", "🔬"], ["changes", "變動", "🕘"], ["settings", "設定・本房", "⚙️"], ["board", "訊息版", "📰"], ["pipeline", "產線", "🏭"], ["wiki", "知識庫", "📖"], ["errors", "工單＋報錯", "📝"]]){
    const b = document.createElement("button");
    b.className = "pagebtn" + ($("#sidePane") && !$("#sidePane").hidden && $("#sidePane").dataset.cur === p ? " sel" : "");
    b.textContent = ic + " " + label; b.title = label + "（右側面板）";
    // 使用者 11-20 04:11：待討論、研究需要我批的也用「新」
    const need = p === "decide" ? attn.decide : p === "research" ? attn.research : 0;
    if(need > 0){ const s = document.createElement("span"); s.className = "new"; s.textContent = "新 " + need; b.appendChild(s); b.title += "：有 " + need + " 項等你看"; }
    if(p === "decide" && need > 0) b.classList.add("blinkblue");   // 使用者 11-23 06:09：有待討論／你的工單 → 藍底＋閃爍
    // 使用者 11-22 00:37：設定與本房合併成一頁 → 一顆「⚙️ 設定・本房」，打開時定位到目前這個房間那一列
    if(p === "settings") b.title = "設定（含本房間設定，會標出目前這個房間）（右側面板）";
    b.onclick = () => { if(p === "settings") openSide("settings", "row_" + room); else openSide(p); renderRooms(rooms); };
    nav.appendChild(b);
  }
}
const WHO = {
  "使用者": {cls:"m-me", face:"f-me", ch:"你", name:"你"},
  "Claude": {cls:"m-claude", face:"f-claude", ch:"C", name:"Claude"},
  "Codex":  {cls:"m-codex", face:"f-codex", ch:"X", name:"Codex"},
  "Gemini": {cls:"m-gemini", face:"f-gemini", ch:"G", name:"Gemini"},
  "輝達":   {cls:"m-nvidia", face:"f-nvidia", ch:"N", name:"輝達"},
  "DeepSeek": {cls:"m-deepseek", face:"f-deepseek", ch:"D", name:"DeepSeek"},
  "手搓網路": {cls:"m-other", face:"f-other", ch:"搓", name:"手搓網路"},   // 使用者 11-20 08:18「他能加入我們了，同為神經網路」
  "系統":   {cls:"m-sys"}
};
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function md(t){
  // 使用者 22:20：網址後面緊接中文會被一起吃進連結（點了 404）→ 裸網址只取英數與網址符號，包成 <網址>
  t = (t || "").replace(/(^|[^(<"'\]`/])(https?:\/\/[A-Za-z0-9\-._~:/?#\[\]@!$&*+,;=%]+[A-Za-z0-9\-_~/#=&%])/g, "$1<$2>");
  t = t.split(/(```[\s\S]*?(?:```|$)|`[^`\n]*`)/).map((seg, i) => i % 2 ? seg : seg.replace(/\*\*(?=\S)([^\n]*?\S)\*\*/g, "<strong>$1</strong>")).join("");
  try{ if(window.marked && window.DOMPurify) return DOMPurify.sanitize(window.marked.parse(t, {breaks:true})); }catch(e){}
  return esc(t).replace(/\n/g,"<br>");
}
function isSharedChange(m){
  return m && m.who === "系統" && /^共用區有變動：/.test(m.text || "");
}
function appendMsg(m, idx){
  if(isSharedChange(m)){
    const rawLines = (m.text || "").split("\n").slice(1).filter(Boolean);
    const lines = rawLines.length ? rawLines : [m.text || ""];
    const prev = list.lastElementChild;
    let el = prev && prev.classList.contains("sys-files-group") ? prev : null;
    if(!el){
      el = document.createElement("div");
      el.className = "msg m-sys sys-files-group";
      el.dataset.batches = "0";
      el.dataset.items = "0";
      el.innerHTML = `<div class="bubble"><details class="sf"><summary></summary><div class="sf-body"></div></details></div>`;
      list.appendChild(el);
    }
    el.dataset.idx = idx;
    const batches = (+el.dataset.batches || 0) + 1;
    const items = (+el.dataset.items || 0) + lines.length;
    el.dataset.batches = batches;
    el.dataset.items = items;
    const t = m.time || "";
    if(!el.dataset.firstTime) el.dataset.firstTime = t;
    const range = el.dataset.firstTime && t && el.dataset.firstTime !== t ? `${el.dataset.firstTime}–${t}` : (t || el.dataset.firstTime);
    el.querySelector(".sf summary").textContent =
      (batches > 1 ? `共用區連續變動 ${batches} 次（共 ${items} 項` : `共用區有變動（${items} 項`) + (range ? ` · ${range}` : "") + "）";
    const batchEl = document.createElement("div");
    batchEl.className = "sf-batch";
    batchEl.innerHTML = (t ? `<div class="sf-time">${esc(t)}</div>` : "") + lines.map(l => `<div>${esc(l)}</div>`).join("");
    el.querySelector(".sf-body").appendChild(batchEl);
    return;
  }
  list.appendChild(render(m, idx));
}
function render(m, idx){
  // 不認得的發言者（例如共用區 inbox 的「視窗Claude」「GPT」）：用一般對話框，名字照寫
  const w = m.src === "旁聽" ? Object.assign({}, WHO["使用者"], {name: esc(m.who)}) : WHO[m.who] || ((m.src === "共用區" || m.src === "子代理" || m.src === "雲端硬碟" || /^小AI|^手搓網路$/.test(m.who || "")) ? {cls:"m-other", face:"f-other", ch:esc((m.who||"?").slice(0,1)), name:esc(m.who)} : WHO["系統"]);
  const el = document.createElement("div");
  el.className = "msg " + w.cls + (m.kind === "note" || m.kind === "silent" ? " note" : "");
  el.dataset.idx = idx;
  if(w.cls === "m-sys"){ el.innerHTML = `<div class="bubble">${esc(m.text)}</div>`; return el; }
  const src = m.src === "Telegram" ? " · 來自 Telegram" : m.src === "電腦" ? " · 電腦" : m.src === "備援" ? " · 備援 Claude（終端機不在）" : m.src === "App" ? " · 來自 Codex App" : m.src === "共用區" ? " · 從共用區 inbox" : "";
  const tag = m.kind === "report" ? `<span class="tag">完成回報</span>` : m.kind === "note" ? `<span class="tag">只記下</span>` : m.kind === "silent" ? `<span class="tag" title="你在這個 AI 視窗講的話，同步過來當上文，不會叫醒任何人">旁聽</span>` : m.kind === "side" ? `<span class="tag" title="主線還在做先前的事，這則是先回答的">先回答</span>` : "";
  const ab = abbrHits(m.text);   // 使用者 11-21 06:13：縮寫介紹（訊息框左邊，預設不展開）
  el.innerHTML = `<div class="lcol"><div class="face ${w.face}">${w.ch}</div>${ab.length ? `<button type="button" class="abbrBtn" aria-expanded="false" title="這則訊息裡的縮寫是什麼意思">縮寫介紹</button>` : ""}</div><div class="body">
    <div class="meta"><button class="bm${isMarked(idx) ? " on" : ""}" title="加入／移除書籤">🔖</button><b>${w.name}</b>${tag}${esc(m.time||"")}${src}</div>
    <div class="bubble">${md(m.text)}</div><div class="abbrBox" hidden></div><div class="live"></div></div>`;
  el.querySelector(".bm").onclick = () => toggleMark(m, idx, el);
  const abb = el.querySelector(".abbrBtn");
  if(abb){
    const box = el.querySelector(".abbrBox");
    const setAbbrOpen = open => {
      box.hidden = !open;

    if(selected.includes("cpu")) lines.push("CPU " + pct(row.cpu) + (duration(row.cpu_interval_s) ? "（" + duration(row.cpu_interval_s) + "平均）" : ""));
    if(selected.includes("ram")){
      const used = Number.isFinite(row.physical_total) && Number.isFinite(row.physical_available) ? row.physical_total - row.physical_available : null;
      lines.push("實體 RAM " + gib(used) + "／" + gib(row.physical_total) + " GiB，可用 " + gib(row.physical_available) + " GiB");
    }
    if(selected.includes("commit")) lines.push("已認可記憶體 " + gib(row.commit_used) + "／" + gib(row.commit_limit) + " GiB");
    return lines.join("；");
  }
  const recent = mode === "history";
  const latest = data.latest;
  const history = (data.history || []).filter(row => row.time && row.time !== latest.time).slice(-5);
  const title = "【系統資源｜" + (recent ? "近期快照" : "最新摘要") + (data.stale ? "，資料過期" : "") + "】";
  const rows = recent ? history.concat(latest).map(row => stamp(row) + "　" + reading(row)) : [stamp(latest), reading(latest)];
  return [title, ...rows].join("\n");
}

  show(open); btn.onclick = () => show(bar.hidden);
})();
/* 網頁工單 #67：①「只問 X」只留 AI 名 ②「Claude／Codex 先講」鈕修好：以前「問大家」送出的名單永遠 Claude 在前，按鈕切了也沒用 */
(() => {
  document.querySelectorAll('#target button[data-t]').forEach(b => { const t = b.firstChild;
    if(t && t.nodeType === 3 && t.textContent.startsWith("只問 ")) t.textContent = t.textContent.slice(3); });
  try{
    const orig = groupMembers;
    groupMembers = function(){ const m = orig(); const ob = document.getElementById("order");
      if(ob && ob.textContent.startsWith("Codex")){ const i = m.indexOf("claude"), j = m.indexOf("codex");
        if(i >= 0 && j >= 0 && i < j){ m[i] = "codex"; m[j] = "claude"; } }
      return m; };
    const ob = document.getElementById("order");
    if(ob) ob.addEventListener("click", () => { ob.textContent = ob.textContent.startsWith("Claude") ? "Codex 先講" : "Claude 先講"; });
  }catch(e){}
})();
/* 工單 #193（使用者 11-22 03:10）：每則訊息右下角「＋關注」→ 訊息版「給你」分頁的「📌 你關注的」 */
(() => {
  const K2 = new URLSearchParams(location.search).get("k") || "";
  const add = el => { if(!el.dataset || el.dataset.idx == null || el.querySelector(".fol") || el.classList.contains("m-sys")) return;
    const bub = el.querySelector(".bubble"); if(!bub) return;
    const b = document.createElement("button"); b.className = "fol"; b.textContent = "＋關注"; b.title = "關注這則：有進展會出現在訊息版「給你」";
    b.onclick = async e => { e.stopPropagation(); try{ const r = await fetch("/api/board_user", {method:"POST", headers:{"X-Key":K2, "Content-Type":"application/json"},
        body: JSON.stringify({op:"follow", room: (typeof room !== "undefined" ? room : "main"), idx: +el.dataset.idx})}); const j = await r.json();
        b.textContent = j.ok ? "📌 已關注" : "關注失敗"; }catch(err){ b.textContent = "關注失敗"; } };
    /* 工單 #195（使用者 11-22 03:44）：關注左邊「好」「好＋馬上做」，回給這則的發言者 */
    const bar = document.createElement("span"); bar.className = "qbar";
    const nameEl = el.querySelector(".meta b"); const who = nameEl ? nameEl.textContent.trim() : "";
    const T = {"Claude":"claude","Codex":"codex","Gemini":"gemini","輝達":"nvidia","DeepSeek":"deepseek"}[who] || "both";
    const snip = ((bub.innerText || "").replace(/\s+/g, " ").trim()).slice(0, 30);
    /* 工單 #217（使用者 11-22 04:40）：「好」只記下、不叫醒 AI（target=note），下次有人被叫時一起看到；「好＋馬上做」才立刻叫 */
    const reply = async (btn, txt, quiet) => { try{ const r = await fetch("/api/send", {method:"POST", headers:{"X-Key":K2, "Content-Type":"application/json"},
        body: JSON.stringify({text: txt + `（回覆 ${who}：「${snip}…」）`, target: quiet ? "note" : T, room: (typeof room !== "undefined" ? room : "main"), members: (typeof groupMembers === "function" ? groupMembers() : undefined)})});
        const j = await r.json(); btn.textContent = j.error ? "送出失敗" : (quiet ? "✓ 已記下" : "✓ 已送"); }catch(err){ btn.textContent = "送出失敗"; } };
    const ok = document.createElement("button"); ok.className = "ok"; ok.textContent = "好"; ok.title = "回覆「好」給 " + (who || "大家") + "（只記下，不叫醒；下次被叫時會看到）";
    ok.onclick = e => { e.stopPropagation(); reply(ok, "好", true); /* 使用者 11-22 04:45：「好」用訂閱推送：原訊息＋好 放進該 AI 的派報下一期 */ fetch("/api/board_user", {method:"POST", headers:{"X-Key":K2, "Content-Type":"application/json"}, body: JSON.stringify({op:"ok_push", room: (typeof room !== "undefined" ? room : "main"), idx: +el.dataset.idx, who})}).catch(()=>{}); };
    const go = document.createElement("button"); go.className = "okgo"; go.textContent = "好＋馬上做"; go.title = "回覆「好，開單做」：開工單並馬上動手";
    go.onclick = e => { e.stopPropagation(); reply(go, "好，開單做（馬上做）"); };
    bar.appendChild(ok); bar.appendChild(go); bar.appendChild(b);
    bub.appendChild(bar); };
  const list = document.getElementById("list"); if(!list) return;
  /* 工單 #222（使用者 11-22 05:21）：①右側欄頁面字體跟訊息框內文一樣大（15px）②關注有新進展時「訊息版」按鈕抹藍 */
  const fitFont = fr => { try{ const d = fr.contentDocument; if(!d || d.getElementById("u222")) return;
      const st = d.createElement("style"); st.id = "u222";
      st.textContent = "body{font-size:15px !important;line-height:1.6} li,td,th,p,summary,.pre,section{font-size:15px} .meta,.m{font-size:13px !important} h3{font-size:17px}";
      (d.head || d.documentElement).appendChild(st); }catch(e){} };
  const watchFrames = () => document.querySelectorAll("iframe.sideFrame").forEach(fr => { if(!fr.dataset.u222){ fr.dataset.u222 = "1"; fr.addEventListener("load", () => fitFont(fr)); } fitFont(fr); });
  setInterval(watchFrames, 1500);
  const boardBlue = async () => { try{ const r = await fetch("/api/board_user", {method:"POST", headers:{"X-Key":K2, "Content-Type":"application/json"}, body: JSON.stringify({op:"count"})});
      const j = await r.json(); const n = j.follow_new || 0;
      document.querySelectorAll("#rooms .pagebtn, #pagebar button").forEach(b => { if(b.textContent.includes("訊息版")){
        b.style.background = n ? "#1e88e5" : (b.closest("#pagebar") ? "#d35400" : ""); b.style.color = n ? "#fff" : "";
        b.title = n ? `訊息版：你關注的有 ${n} 則新進展` : "訊息版（右側面板）"; } }); }catch(e){} };
  boardBlue(); setInterval(boardBlue, 30000);
  /* 子代理顯示所屬 AI（使用者 11-22 05:12）：手搓匠、流程優化員是 Claude 的子代理 → 名字顯示「Claude・手搓匠」 */
  const SUBP = {"手搓匠":"Claude", "流程優化員":"Claude"};
  const tagSub = el => { const nb = el.querySelector && el.querySelector(".meta b"); if(!nb || nb.dataset.sub) return;
    const nm = nb.textContent.trim(); const base = Object.keys(SUBP).find(k => nm === k || nm.startsWith(k));
    if(base && !nm.includes("・")){ nb.textContent = SUBP[base] + "・" + nm; nb.dataset.sub = "1"; nb.title = SUBP[base] + " 的子代理"; } };
  const add0 = add; const addAll = el => { tagSub(el); add0(el); };
  list.querySelectorAll(".msg").forEach(addAll);
  new MutationObserver(ms => ms.forEach(m => m.addedNodes.forEach(n => { if(n.nodeType === 1){ if(n.classList.contains("msg")) addAll(n); else n.querySelectorAll && n.querySelectorAll(".msg").forEach(addAll); } }))).observe(list, {childList:true, subtree:true});
})();
</script>
