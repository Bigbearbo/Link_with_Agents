<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>三方討論</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
:root{
  --bg:#f4f2ee; --panel:#ffffff; --ink:#1d1b18; --muted:#7a756d; --line:#e4e0d8;
  --me:#2f6fde; --me-bg:#e8f0fd; --claude:#c8643b; --claude-bg:#fbefe8; --codex:#0f9a74; --codex-bg:#e6f5f0; --gemini:#4f6bed; --nvidia:#76b900; --deepseek:#4d6bfe;
  --sys:#8a857c; --sys-bg:#efede8; --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.04);
  --font:"Segoe UI","Microsoft JhengHei UI","Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#17171a; --panel:#202024; --ink:#ecebe8; --muted:#9a968f; --line:#2f2f35;
  --me:#7aa7ff; --me-bg:#1f2a40; --claude:#f0956b; --claude-bg:#3a261d; --codex:#4fd1a7; --codex-bg:#16332b; --gemini:#8fa2ff; --nvidia:#9ad62a; --deepseek:#8aa0ff;
  --sys:#9a968f; --sys-bg:#26262b; --shadow:none; color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--font);display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--line)}
.rooms{display:flex;gap:6px;padding:8px 20px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto}
.rooms button{border-radius:999px;padding:4px 14px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.rooms button.sel{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.rooms .badge{width:7px;height:7px;border-radius:50%;background:var(--codex);display:inline-block}
.rooms .badge.ap{background:var(--claude)}
.rooms .pagebtn{background:var(--sys-bg)}.rooms .spacer{flex:1}
.rooms .new{font-size:11px;background:var(--me);color:#fff;border-radius:999px;padding:0 6px}
header h1{font-size:17px;margin:0;font-weight:650;letter-spacing:.02em}
.faces{display:flex;gap:4px}
.face{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff}
.f-me{background:var(--me)}.f-claude{background:var(--claude)}.f-codex{background:var(--codex)}.f-gemini{background:var(--gemini)}.f-nvidia{background:var(--nvidia)}.f-deepseek{background:var(--deepseek)}
.spacer{flex:1}
.pill{font-size:12.5px;padding:4px 10px;border-radius:999px;background:var(--sys-bg);color:var(--muted);white-space:nowrap}
.pill.on{color:var(--codex)} .pill.warn{color:var(--claude)}
.pill.busy{color:var(--ink)} .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:currentColor;margin-right:6px;vertical-align:1px}
.pill.busy .dot{animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}
main{flex:1;overflow-y:auto;padding:20px 16px 8px}
.wrap{max-width:860px;margin:0 auto}
.msg{display:flex;gap:10px;margin:0 0 14px;align-items:flex-start}
.msg .face{flex:none;width:32px;height:32px;font-size:13px;margin-top:2px}
.body{min-width:0;max-width:calc(100% - 42px)}
.meta{font-size:12.5px;color:var(--muted);margin:0 0 3px 2px}
.meta b{font-weight:650;margin-right:6px}
.bubble h1,.bubble h2,.bubble h3,.bubble h4{font-size:1.02em;margin:.5em 0 .3em;font-weight:650}  /* 訊息裡的標題不要放大（輝達貼程式時 # 註解被當成大標題） */
.bubble{background:var(--panel);border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:9px 14px;box-shadow:var(--shadow);overflow-wrap:anywhere}
.m-me{flex-direction:row-reverse}.m-me .meta{text-align:right}.m-me .bubble{background:var(--me-bg);border-color:transparent;border-radius:14px 4px 14px 14px}
.m-claude .bubble{border-left:3px solid var(--claude)} .m-claude .meta b{color:var(--claude)}
.m-codex .bubble{border-left:3px solid var(--codex)} .m-codex .meta b{color:var(--codex)}
.m-gemini .bubble{border-left:3px solid var(--gemini)} .m-gemini .meta b{color:var(--gemini)}
.m-nvidia .bubble{border-left:3px solid var(--nvidia)} .m-nvidia .meta b{color:var(--nvidia)}
.m-deepseek .bubble{border-left:3px solid var(--deepseek)} .m-deepseek .meta b{color:var(--deepseek)}
.m-me .meta b{color:var(--me)}
.m-sys{justify-content:center}.m-sys .bubble{background:transparent;border:none;box-shadow:none;color:var(--sys);font-size:13px;padding:2px 8px;text-align:center}
.m-sys .sf{display:inline-block;max-width:100%;text-align:center}
.m-sys .sf summary{cursor:pointer;list-style:none;display:inline-block;padding:2px 10px;border-radius:999px;background:var(--sys-bg);color:var(--sys);font-size:12.5px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;user-select:none;vertical-align:middle}
.m-sys .sf summary::-webkit-details-marker{display:none}
.m-sys .sf summary::before{content:"▶";display:inline-block;margin-right:6px;font-size:10px;opacity:.75;transition:transform .15s}
.m-sys .sf[open] summary::before{transform:rotate(90deg)}
.m-sys .sf-body{margin:6px auto 0;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);text-align:left;max-width:680px;font-size:12.5px;line-height:1.5}
.m-sys .sf-batch+.sf-batch{margin-top:6px;padding-top:6px;border-top:1px dashed var(--line)}
.m-sys .sf-time{color:var(--muted);font-size:11.5px;margin-bottom:2px}
.bubble p{margin:.35em 0}.bubble>:first-child{margin-top:0}.bubble>:last-child{margin-bottom:0}
.bubble pre{background:var(--sys-bg);padding:10px;border-radius:8px;overflow-x:auto;font-size:13px}
.bubble code{font-family:Consolas,"Cascadia Mono",monospace;font-size:.92em;background:var(--sys-bg);padding:1px 5px;border-radius:4px}
.bubble pre code{background:none;padding:0}
.bubble table{border-collapse:collapse;display:block;overflow-x:auto}.bubble td,.bubble th{border:1px solid var(--line);padding:4px 8px}
.bubble ul,.bubble ol{padding-left:1.4em;margin:.35em 0}
.empty{text-align:center;color:var(--muted);margin-top:18vh}
.older{text-align:center;color:var(--muted);font-size:12.5px;margin:0 0 14px}
.empty .big{font-size:20px;color:var(--ink);margin-bottom:6px}
.thinking{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:13.5px;margin:4px 0 14px}
.live:empty{display:none}
.live{margin-top:6px;font-size:12.5px;color:var(--muted)}
.pbar{height:4px;border-radius:999px;background:var(--line);overflow:hidden;margin-bottom:5px}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--codex),var(--me));transition:width .8s}
.m-claude .pbar i{background:linear-gradient(90deg,var(--claude),var(--me))}
.ptext{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-me .bubble:has(+ .live){}
.msg.note .bubble{background:transparent;border:1px dashed var(--me)}
.f-other{background:#8a63d2}.m-other .bubble{border-left:3px solid #8a63d2}.m-other .meta b{color:#8a63d2}
.tag{font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--sys-bg);color:var(--ink);margin-right:6px}
.thinking .face{width:32px;height:32px;flex:none}
.tbody{min-width:0;padding-top:5px}
.steps{list-style:none;margin:6px 0 0;padding:6px 10px;border-left:2px solid var(--line);font-size:12.5px;font-family:Consolas,"Cascadia Mono",var(--font)}
.steps li{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.6}
.steps li:last-child{opacity:1;color:var(--ink)}
.queued{margin-top:6px;font-size:12.5px;color:var(--me)}
.dots{display:inline-flex;gap:3px;margin-right:8px;vertical-align:2px}
.dots i{width:5px;height:5px;border-radius:50%;background:currentColor;animation:pulse 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
footer{background:var(--panel);border-top:1px solid var(--line);padding:10px 16px 14px}
.composer{max-width:860px;margin:0 auto}
.tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:none;border-radius:0;background:transparent}
.seg button.sel{background:var(--ink);color:var(--panel)}
.seg button.skip{padding:0 6px;font-size:11px;color:var(--muted);border-left:1px dashed var(--line);min-width:0}
.seg button.skip{background:rgba(46,158,107,.16);color:#1f7a52;font-weight:600}
#target.solo-mode button.skip{opacity:.35}
/* 只問按鈕的用量警示：底線顏色＝那位的額度狀況（只提示，不擋） */
#target button.risk1{box-shadow:inset 0 -3px 0 #d99a1e}
#target button.risk2{box-shadow:inset 0 -3px 0 #d9483b;color:#d9483b}
#target button.sel.risk2{color:var(--panel)}  /* 選「只問 X」時群名單不生效，只是保留勾選 */
.seg button.skip.off{background:rgba(128,128,128,.14);color:var(--muted);text-decoration:line-through;font-weight:400}
@media (prefers-color-scheme:dark){.seg button.skip{background:rgba(79,209,167,.18);color:#7fe0bd}.seg button.skip.off{background:rgba(255,255,255,.06);color:var(--muted)}}
button{font:inherit;font-size:13px;padding:5px 11px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);cursor:pointer}
button:hover{filter:brightness(.96)} button:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;align-items:flex-end}
textarea{flex:1;resize:none;font:inherit;font-size:15px;line-height:1.5;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);min-height:46px;max-height:40vh;outline:none}
textarea:focus{border-color:var(--me)}
.send{background:var(--me);color:#fff;border:none;border-radius:12px;padding:0 18px;height:46px;font-size:15px;font-weight:600}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
select{font:inherit;font-size:13px;padding:4px 6px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}
.switch{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);cursor:pointer;user-select:none}
.switch input{display:none}
.track{width:34px;height:19px;border-radius:999px;background:var(--line);position:relative;transition:.15s}
.track::after{content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.switch input:checked+.track{background:var(--claude)}
.switch input:checked+.track::after{left:17px}
.switch.rw{color:var(--claude);font-weight:600}
.approval{border:1px solid var(--claude);background:var(--claude-bg);border-radius:12px;padding:10px 14px;margin-bottom:10px}
.approval ul{margin:6px 0 8px;padding-left:1.2em;font-family:Consolas,"Cascadia Mono",var(--font);font-size:13px;overflow-wrap:anywhere}
.ap-btns{display:flex;gap:8px}
.ap-btns .allow{background:var(--claude);color:#fff;border-color:transparent;font-weight:600}
@media (max-width:600px){header{flex-wrap:wrap}.hint{display:none}}
/* ---- 側邊用量表 ---- */
#usage{position:fixed;right:16px;top:118px;width:250px;max-height:calc(100vh - 140px);overflow-y:auto;
  background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:12.5px;z-index:5;
  box-shadow:0 2px 10px rgba(0,0,0,.05)}
#usage h3{margin:0 0 8px;font-size:13px;font-weight:650;display:flex;justify-content:space-between;align-items:baseline}
#usage h3 small{color:var(--muted);font-weight:400}
.u-agent{padding:8px 0;border-top:1px solid var(--line)}
.u-agent:first-of-type{border-top:0}
.u-name{display:flex;align-items:center;gap:6px;font-weight:600;margin-bottom:4px}
.u-name .face{width:18px;height:18px;font-size:10px}
.u-name small{margin-left:auto;color:var(--muted);font-weight:400}
.u-win{margin:5px 0}
.u-row{display:flex;justify-content:space-between;color:var(--muted)}
.u-row b{color:var(--ink);font-weight:600}
.u-bar{position:relative;height:7px;border-radius:4px;background:var(--line);margin:3px 0 1px;overflow:visible}
.u-fill{height:100%;border-radius:4px;background:#2e9e6b}
.u-fill.warn{background:#d99a1e}.u-fill.hot{background:#d9483b}
.u-tick{position:absolute;top:-3px;width:2px;height:13px;background:var(--ink);opacity:.55;border-radius:1px}
.u-goal{position:absolute;top:-4px;width:0;height:15px;border-left:2px dashed var(--codex);opacity:.9}
.u-verdict{color:var(--muted);margin-top:3px;line-height:1.4}
.u-verdict.hot{color:#d9483b}
.u-stale{color:#d99a1e}
.u-legend{color:var(--muted);font-size:11.5px;margin-top:8px;line-height:1.4}
#usageBtn{cursor:pointer}
#updBtn{cursor:pointer;background:#2f6fde;color:#fff;border-color:#2f6fde;font-weight:600;animation:updPulse 2s ease-in-out infinite}
@keyframes updPulse{50%{opacity:.6}}
@media (max-width:1379px){#usage{display:none;right:12px;top:64px}#usage.open{display:block}}
@media (min-width:1380px){#usageBtn{display:none}}
/* 書籤（使用者 11-19 22:01）：左邊列表、點了跳過去、可刪；每則發言左上角有加書籤按鈕 */
#marks{position:fixed;left:16px;top:118px;width:230px;max-height:calc(100vh - 140px);overflow-y:auto;
  background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:12.5px;z-index:5;
  box-shadow:0 2px 10px rgba(0,0,0,.05)}
#marks h3{margin:0 0 8px;font-size:13px;font-weight:650;display:flex;justify-content:space-between;align-items:center}
#marksMin{border:none;background:none;cursor:pointer;font-size:14px;padding:0 4px;color:var(--muted)}
#marks.mini{width:auto;padding:6px 10px}#marks.mini #marksList{display:none}#marks.mini h3{margin:0}
#marks .mk{display:flex;gap:6px;align-items:flex-start;padding:6px 4px;border-radius:8px;cursor:pointer}
#marks .mk:hover{background:var(--sys-bg)}
#marks .mk .t{flex:1;min-width:0}
#marks .mk .w{color:var(--muted);font-size:11.5px}
#marks .mk .x{flex:none;border:none;background:none;color:var(--muted);cursor:pointer;padding:0 2px;font-size:13px}
#marks .mk .x:hover{color:var(--claude)}
#marks .none{color:var(--muted)}
#marksBtn{cursor:pointer}
@media (max-width:1379px){#marks{display:none;left:12px;top:64px}#marks.open{display:block}}
@media (min-width:1380px){#marksBtn{display:none}}
.bm{border:none;background:none;cursor:pointer;padding:0 4px 0 0;font-size:12px;opacity:.35;vertical-align:1px}
.msg:hover .bm{opacity:.8}.bm.on{opacity:1}
.oldctx{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.oldctx .box{background:var(--bg);color:var(--ink);border-radius:12px;max-width:900px;width:100%;max-height:88vh;display:flex;flex-direction:column;overflow:hidden}
.oldctx .hd{display:flex;gap:8px;align-items:center;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.oldctx .hd .x{margin-left:auto}
.oldctx .bd{overflow:auto;padding:12px}
.msg.hit .bubble{outline:2px solid var(--me);outline-offset:2px}
.msg.flash .bubble{outline:2px solid var(--me);outline-offset:2px;transition:outline-color 1.5s}
:root{--sidew:560px}
#sidePane{position:fixed;right:0;top:56px;bottom:0;width:min(var(--sidew),100vw);background:var(--panel);border-left:1px solid var(--line);
  z-index:20;display:flex;flex-direction:column;box-shadow:-4px 0 16px rgba(0,0,0,.08)}
#sidePane[hidden]{display:none}
#sidePane .side-tabs{display:flex;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line);align-items:center}
#sidePane .side-tabs button{border-radius:999px;padding:3px 12px}
#sidePane .side-tabs button.sel{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.sideFrame{flex:1;border:0;width:100%;background:var(--bg)}.sideFrame[hidden]{display:none}
@media (min-width:1100px){body.side-open main,body.side-open footer{margin-right:var(--sidew)}body.side-open #usage{display:none}}
/* 使用者 11-20 01:10：拉中間的條調寬度；⤢ 放大成整頁（左邊聊天縮掉） */
#sideGrip{position:absolute;left:-4px;top:0;bottom:0;width:8px;cursor:col-resize;z-index:21}
#sideGrip:hover,#sideGrip.drag{background:var(--me);opacity:.35}
body.side-max #sidePane{width:100vw}body.side-max main,body.side-max footer,body.side-max #marks{display:none}
body.dragging iframe{pointer-events:none}body.dragging{user-select:none;cursor:col-resize}
.cp{border:none;background:none;cursor:pointer;font-size:11px;padding:0 3px;opacity:.55;vertical-align:1px}.cp:hover{opacity:1}
a.fp{font-family:Consolas,monospace;font-size:.92em}
/* 收合模式：每則只顯示 小標題＋三行，點一下展開 */
body.fold .bubble:not(.open){max-height:5.6em;overflow:hidden;cursor:zoom-in;position:relative}
body.fold .bubble:not(.open)::after{content:"";position:absolute;left:0;right:0;bottom:0;height:1.6em;background:linear-gradient(transparent,var(--panel))}
body.fold .m-me .bubble:not(.open)::after{background:linear-gradient(transparent,var(--me-bg))}
body.fold .bubble[data-title]:not(.open)::before{content:"▸ " attr(data-title);display:block;font-weight:650}
body.fold .bubble[data-title]:not(.open) > :first-child{display:none}
body.fold .m-sys .bubble{max-height:none}
body.fold .m-sys .bubble::after{display:none}
</style>
</head>
<body>
<header>
  <div class="faces"><div class="face f-me">你</div><div class="face f-claude">C</div><div class="face f-codex">X</div><div class="face f-gemini">G</div><div class="face f-nvidia">N</div><div class="face f-deepseek">D</div></div>
  <h1>三方討論</h1>
  <div class="spacer"></div>
  <label class="switch" title="開啟後 Claude 與 Codex 可以改檔案、執行指令"><input type="checkbox" id="write"><span class="track"></span><span id="writeLbl">唯讀</span></label>
  <span id="health" class="pill warn" hidden></span>
  <span id="updBtn" class="pill upd" title="網頁有新版本，點一下重新整理" hidden>🔄 有更新，點我重新整理</span>
  <span id="foldBtn" class="pill" title="全部縮成 小標題＋三行，點一則展開" style="cursor:pointer">↕ 收合</span>
  <span id="marksBtn" class="pill" title="書籤">🔖 書籤</span>
  <span id="usageBtn" class="pill" title="大家的用量">📊 用量</span>
  <span id="tg" class="pill"><span class="dot"></span>Telegram</span>
  <span id="st" class="pill"><span class="dot"></span>連線中</span>
</header>
<nav id="rooms" class="rooms"></nav>
<main id="main"><div class="wrap" id="list"></div></main>
<aside id="usage"><h3>大家的用量 <small id="usageTime"></small></h3><div id="usageList">載入中…</div>
<div class="u-legend">色條＝已用；黑線＝時間窗已過多少。色條超過黑線＝用得比時間快。</div></aside>
<aside id="sidePane" hidden><div id="sideGrip" title="拖曳調整寬度"></div><div class="side-tabs"><button data-p="decide">待討論</button><button data-p="research">研究</button><button data-p="changes">變動</button><button data-p="settings">設定</button>
<span class="spacer"></span><button id="sideMax" title="放大成整頁／還原（左邊聊天縮掉）">⤢</button><button id="sideReload" title="重新整理">↻</button><button id="sideClose" title="收起">✕</button></div>
</aside>
<aside id="marks"><h3>🔖 書籤 <button id="marksMin" title="縮小／展開">－</button></h3><div id="marksList" class="none">還沒有書籤。滑到發言上，點名字前面的 🔖 加入。</div></aside>
<footer><div class="composer">
  <div id="approval" class="approval" hidden>
    <div class="ap-title">🔐 <b id="apWho"></b> 想做一件跟安全有關的事，需要你同意：</div>
    <ul id="apItems"></ul>

<script>
const KEY = new URLSearchParams(location.search).get("k") || "";
const $ = s => document.querySelector(s);
const list = $("#list"), main = $("#main"), box = $("#box");
let total = 0, epoch = 0, target = "both", busy = false, confirmNew = 0;

function switchRoom(id){

function renderRooms(rooms){

  for(const [p, label, ic] of [["decide", "待討論", "🗳️"], ["research", "研究", "🔬"], ["changes", "變動", "🕘"], ["settings", "設定", "⚙️"]]){

  const rs = document.createElement("button"); rs.className = "pagebtn"; rs.textContent = "⚙️ 本房"; rs.title = "打開設定，定位到目前這個房間";
  rs.onclick = () => { openSide("settings", "row_" + room, true); renderRooms(rooms); };

const WHO = {
  "使用者": {cls:"m-me", face:"f-me", ch:"你", name:"你"},
  "Claude": {cls:"m-claude", face:"f-claude", ch:"C", name:"Claude"},
  "Codex":  {cls:"m-codex", face:"f-codex", ch:"X", name:"Codex"},
  "Gemini": {cls:"m-gemini", face:"f-gemini", ch:"G", name:"Gemini"},
  "輝達":   {cls:"m-nvidia", face:"f-nvidia", ch:"N", name:"輝達"},
  "DeepSeek": {cls:"m-deepseek", face:"f-deepseek", ch:"D", name:"DeepSeek"},
  "系統":   {cls:"m-sys"}
};
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function md(t){
  // 使用者 22:20：網址後面緊接中文會被一起吃進連結（點了 404）→ 裸網址只取英數與網址符號，包成 <網址>
  t = (t || "").replace(/(^|[^(<"'\]`/])(https?:\/\/[A-Za-z0-9\-._~:/?#\[\]@!$&*+,;=%]+[A-Za-z0-9\-_~/#=&%])/g, "$1<$2>");
  try{ if(window.marked && window.DOMPurify) return DOMPurify.sanitize(marked.parse(t, {breaks:true})); }catch(e){}
  return esc(t).replace(/\n/g,"<br>");
}
function isSharedChange(m){
  return m && m.who === "系統" && /^共用區有變動：/.test(m.text || "");
}
function appendMsg(m, idx){
  if(isSharedChange(m)){
    const rawLines = (m.text || "").split("\n").slice(1).filter(Boolean);
    const lines = rawLines.length ? rawLines : [m.text || ""];
    const prev = list.lastElementChild;
    let el = prev && prev.classList.contains("sys-files-group") ? prev : null;
    if(!el){
      el = document.createElement("div");
      el.className = "msg m-sys sys-files-group";
      el.dataset.batches = "0";
      el.dataset.items = "0";
      el.innerHTML = `<div class="bubble"><details class="sf"><summary></summary><div class="sf-body"></div></details></div>`;
      list.appendChild(el);
    }
    el.dataset.idx = idx;
    const batches = (+el.dataset.batches || 0) + 1;
    const items = (+el.dataset.items || 0) + lines.length;
    el.dataset.batches = batches;
    el.dataset.items = items;
    const t = m.time || "";
    if(!el.dataset.firstTime) el.dataset.firstTime = t;
    const range = el.dataset.firstTime && t && el.dataset.firstTime !== t ? `${el.dataset.firstTime}–${t}` : (t || el.dataset.firstTime);
    el.querySelector(".sf summary").textContent =
      (batches > 1 ? `共用區連續變動 ${batches} 次（共 ${items} 項` : `共用區有變動（${items} 項`) + (range ? ` · ${range}` : "") + "）";
    const batchEl = document.createElement("div");
    batchEl.className = "sf-batch";
    batchEl.innerHTML = (t ? `<div class="sf-time">${esc(t)}</div>` : "") + lines.map(l => `<div>${esc(l)}</div>`).join("");
    el.querySelector(".sf-body").appendChild(batchEl);
    return;
  }
  list.appendChild(render(m, idx));
}
function render(m, idx){
  // 不認得的發言者（例如共用區 inbox 的「視窗Claude」「GPT」）：用一般對話框，名字照寫
  const w = WHO[m.who] || (m.src === "共用區" ? {cls:"m-other", face:"f-other", ch:esc((m.who||"?").slice(0,1)), name:esc(m.who)} : WHO["系統"]);
  const el = document.createElement("div");
  el.className = "msg " + w.cls + (m.kind === "note" ? " note" : "");
  el.dataset.idx = idx;
  if(w.cls === "m-sys"){ el.innerHTML = `<div class="bubble">${esc(m.text)}</div>`; return el; }
  const src = m.src === "Telegram" ? " · 來自 Telegram" : m.src === "電腦" ? " · 電腦" : m.src === "備援" ? " · 備援 Claude（終端機不在）" : m.src === "App" ? " · 來自 Codex App" : m.src === "共用區" ? " · 從共用區 inbox" : "";
  const tag = m.kind === "report" ? `<span class="tag">完成回報</span>` : m.kind === "note" ? `<span class="tag">只記下</span>` : m.kind === "side" ? `<span class="tag" title="主線還在做先前的事，這則是先回答的">先回答</span>` : "";
  el.innerHTML = `<div class="face ${w.face}">${w.ch}</div><div class="body">
    <div class="meta"><button class="bm${marked(idx) ? " on" : ""}" title="加入／移除書籤">🔖</button><b>${w.name}</b>${tag}${esc(m.time||"")}${src}</div>
    <div class="bubble">${md(m.text)}</div><div class="live"></div></div>`;
  el.querySelector(".bm").onclick = () => toggleMark(m, idx, el);
  decorate(el.querySelector(".bubble"), m);
  return el;
}
// ---------- 使用者 22:23：連結旁加複製、電腦檔案路徑可點、AI 小標題＋收合成三行 ----------
function titleOf(m){
  const first = ((m.text || "").split("\n").find(l => l.trim()) || "").trim();
  const t = first.replace(/^#{1,6}\s*/, "").replace(/^\*\*(.+)\*\*$/, "$1").replace(/^【(.+)】$/, "$1").trim();
  return (t !== first && t.length <= 40) ? t : "";   // 只認「# 標題」「**標題**」「【標題】」這種整行標題
}
function copyText(s, btn){
  (navigator.clipboard ? navigator.clipboard.writeText(s) : Promise.reject()).then(
    () => { btn.textContent = "✓"; setTimeout(() => btn.textContent = "📋", 1200); },
    () => prompt("複製這段：", s));
}
const PATH_RE = /\b[A-Za-z]:\\[^\s`'"<>|*?：，。；、（）()「」]+/g;
function decorate(bub, m){
  if(!bub) return;
  bub.querySelectorAll("a[href^='http']").forEach(a => {   // 網址：開新分頁＋複製鈕（複製的是實際網址）
    a.target = "_blank"; a.rel = "noopener";
    const b = document.createElement("button"); b.className = "cp"; b.textContent = "📋"; b.title = "複製網址：" + a.href;
    b.onclick = e => { e.preventDefault(); copyText(a.href, b); };
    a.after(b);
  });
  const walker = document.createTreeWalker(bub, NodeFilter.SHOW_TEXT);   // 電腦路徑（H:\…）：點了在檔案總管裡選到它＋複製鈕
  const nodes = []; while(walker.nextNode()){ PATH_RE.lastIndex = 0; if(PATH_RE.test(walker.currentNode.nodeValue)) nodes.push(walker.currentNode); }
  for(const n of nodes){
    PATH_RE.lastIndex = 0;
    const frag = document.createDocumentFragment(); let last = 0, mm;
    const s = n.nodeValue;
    while((mm = PATH_RE.exec(s))){
      frag.append(s.slice(last, mm.index));
      const p = mm[0].replace(/[.,]+$/, "");
      const a = document.createElement("a"); a.href = "#"; a.className = "fp"; a.textContent = p; a.title = "在檔案總管中顯示";
      a.onclick = e => { e.preventDefault(); api("/api/reveal", {path: p}).then(r => { if(!r.ok) alert(r.error || "打不開"); }).catch(() => alert("打不開")); };
      const b = document.createElement("button"); b.className = "cp"; b.textContent = "📋"; b.title = "複製路徑";
      b.onclick = e => { e.preventDefault(); copyText(p, b); };
      frag.append(a, b); last = mm.index + mm[0].length - (mm[0].length - p.length);
    }
    frag.append(s.slice(last)); n.replaceWith(frag);
  }
  const t = titleOf(m);
  if(t) bub.dataset.title = t;
  if(bub.scrollHeight > 0) bub.classList.add("clampable");
  bub.onclick = e => { if(document.body.classList.contains("fold") && !e.target.closest("a,button")) bub.classList.toggle("open"); };
}
// ---------- 書籤（存在中樞 logs/書籤.json，換瀏覽器也在） ----------
let marks = [], roomNames = {};
const markId = idx => `${room}-${idx}`;
function marked(idx){ return marks.some(b => b.id === markId(idx)); }
// 使用者 23:04：「約 00:44 用完」少了日期，看起來像今晚就用完 → 不是今天就連日期一起顯示
function whenStr(t){
  const now = new Date(), mmdd = String(now.getMonth() + 1).padStart(2, "0") + "-" + String(now.getDate()).padStart(2, "0");
  return (t.length >= 11 && t.slice(0, 5) !== mmdd) ? t.slice(-11) : t.slice(-5);
}
function renderMarks(){
  const box = $("#marksList");
  if(!marks.length){ box.className = "none"; box.textContent = "還沒有書籤。滑到發言上，點名字前面的 🔖 加入。"; return; }
  box.className = ""; box.innerHTML = "";
  for(const b of marks.slice().reverse()){
    const d = document.createElement("div"); d.className = "mk";
    d.innerHTML = `<div class="t"><div class="w">${esc(b.room_name || b.room)}｜${esc(b.who)} ${esc(b.time)}</div>${esc(b.text)}</div><button class="x" title="刪除書籤">✕</button>`;
    d.querySelector(".x").onclick = async e => { e.stopPropagation(); await saveMarks({del: b.id}); };
    d.onclick = () => jumpMark(b);
    box.appendChild(d);
  }
}
async function saveMarks(body){
  try{ const r = await api("/api/bookmarks", body); marks = r.bookmarks || []; }catch(e){ alert("書籤存不進去：" + e.message); return; }
  renderMarks();
  document.querySelectorAll(".msg[data-idx]").forEach(el => { const b = el.querySelector(".bm"); if(b) b.classList.toggle("on", marked(+el.dataset.idx)); });
}
async function loadMarks(){ try{ marks = (await api("/api/bookmarks")).bookmarks || []; renderMarks(); }catch(e){} }
function toggleMark(m, idx, el){
  if(marked(idx)) return saveMarks({del: markId(idx)});
  const text = (titleOf(m) || (m.text || "").replace(/\s+/g, " ")).slice(0, 80);   // 有 AI 小標題就用小標題
  saveMarks({add: {room, room_name: roomNames[room] || "", idx, who: m.who, time: m.time, text}});
}
function jumpMark(b, tries = 0){
  if(b.room !== room){ switchRoom(b.room); return setTimeout(() => jumpMark(b, 1), 700); }
  const el = list.querySelector(`.msg[data-idx="${b.idx}"]`);
  if(!el){
    if(tries < 6) return setTimeout(() => jumpMark(b, tries + 1), 500);
    return showAround(b);   // Codex 01:37 補漏：太舊的書籤 → 跳出視窗載入前後各 6 則
  }
  el.scrollIntoView({behavior: "smooth", block: "center"});
  el.classList.add("flash"); setTimeout(() => el.classList.remove("flash"), 1600);
  $("#marks").classList.remove("open");
}
async function showAround(b){
  let d;
  try{ d = await api(`/api/around?room=${encodeURIComponent(b.room)}&idx=${b.idx}`); }catch(e){ return alert("載入舊訊息失敗：" + e.message); }
  const ov = document.createElement("div"); ov.className = "oldctx";
  ov.innerHTML = `<div class="box"><div class="hd"><b>書籤附近的舊訊息</b>（${esc(b.room_name || b.room)}，第 ${b.idx + 1} 則前後）<button class="x" title="回到最新">✕ 回到最新</button></div><div class="bd"></div></div>`;
  const bd = ov.querySelector(".bd");
  d.messages.forEach((m, k) => { const el = render(m, d.start + k); if(d.start + k === b.idx) el.classList.add("flash", "hit"); bd.appendChild(el); });
  const close = () => ov.remove();
  ov.querySelector(".x").onclick = close; ov.onclick = e => { if(e.target === ov) close(); };
  document.body.appendChild(ov); $("#marks").classList.remove("open");
  const hit = bd.querySelector(".hit"); if(hit) hit.scrollIntoView({block: "center"});
}
function showEmpty(){
  list.innerHTML = `<div class="empty"><div class="big">開始一段討論</div>
    你說一句話，Claude 和 Codex 都會發表意見；右上角開關決定他們能不能改檔案。</div>`;
}
let thinkingEl = null;
function setThinking(progress){
  if(thinkingEl){ thinkingEl.remove(); thinkingEl = null; }
  document.querySelectorAll(".live").forEach(x => x.innerHTML = "");
  if(!progress || !progress.length) return;
  thinkingEl = document.createElement("div");
  for(const p of progress){
    const w = WHO[p.who];
    const mm = Math.floor(p.elapsed/60), ss = String(p.elapsed%60).padStart(2,"0");
    const steps = (p.steps||[]).slice(-4).map(s => `<li>${esc(s)}</li>`).join("");
    // 已經回覆過第一句：進度條掛在那則回覆底下
    const anchor = p.anchor != null ? list.querySelector(`.msg[data-idx="${p.anchor}"] .live`) : null;
    if(anchor){
      const pct = Math.min(95, Math.round(100 * (1 - Math.exp(-p.elapsed / 300))));
      anchor.innerHTML = `<div class="pbar"><i style="width:${pct}%"></i></div>
        <div class="ptext"><span class="dots"><i></i><i></i><i></i></span>工作中 · ${mm}:${ss}${p.steps && p.steps.length ? "｜" + esc(p.steps[p.steps.length-1]) : ""}</div>
        ${p.pending ? `<div class="queued">做完手上的事後，會再回應你的新訊息</div>` : ""}`;
      continue;
    }
    const el = document.createElement("div");
    el.className = "thinking";
    el.innerHTML = `<div class="face ${w.face}">${w.ch}</div><div class="tbody">
      <div><span class="dots"><i></i><i></i><i></i></span>${esc(p.label || w.name)} 工作中 · ${mm}:${ss}</div>
      ${steps ? `<ul class="steps">${steps}</ul>` : ""}
      ${p.pending ? `<div class="queued">${w.name} 做完手上的事後，會再回應你的新訊息</div>` : ""}</div>`;
    thinkingEl.appendChild(el);
  }
  list.appendChild(thinkingEl);
}
async function api(path, body){
  const r = await fetch(path, {method: body ? "POST" : "GET", headers: {"X-Key": KEY, "Content-Type":"application/json"},
    body: body ? JSON.stringify(body) : undefined});
  if(!r.ok) throw new Error(r.status);
  return r.json();
}
const FACE = {"Claude":"f-claude","Codex":"f-codex","Gemini":"f-gemini","輝達":"f-nvidia","DeepSeek":"f-deepseek"};
const CH = {"Claude":"C","Codex":"X","Gemini":"G","輝達":"N","DeepSeek":"D"};
async function loadUsage(){
  try{
    const d = await api("/api/usage");
    $("#usageTime").textContent = d.time + " 更新";
    const KEY_OF = {"Claude":"claude","Codex":"codex","Gemini":"gemini","輝達":"nvidia","DeepSeek":"deepseek"};
    for(const a of d.agents){  // 兩級警示：🟠 吃緊（任一窗 ≥80% 或超速）、🔴 快用完（任一窗 ≥95%）
      const b = document.querySelector(`#target button[data-t="${KEY_OF[a.name]}"]`);
      if(!b) continue;
      const ws = a.windows || [];
      const top = Math.max(0, ...ws.map(w => w.used || 0));
      const fast = ws.some(w => w.state === "超速");
      const lv = top >= 95 ? 2 : (top >= 80 || fast) ? 1 : 0;
      b.classList.toggle("risk1", lv === 1); b.classList.toggle("risk2", lv === 2);
      b.title = lv ? `${a.name} 額度${lv === 2 ? "快用完" : "吃緊"}：最高用到 ${Math.round(top)}%${fast ? "、速度超前" : ""}（只是提醒，照樣可以問）` : `${a.name} 額度正常`;
    }
    $("#usageList").innerHTML = d.agents.map(a => {
      const head = `<div class="u-name"><span class="face ${FACE[a.name]||""}">${CH[a.name]||"?"}</span>${esc(a.name)}` +
        (a.missing ? `<small>沒有資料</small></div>` :
         `<small class="${a.age_min > 90 ? "u-stale" : ""}">${a.age_min > 90 ? "⚠ " : ""}${esc(a.updated||"")}</small></div>`);
      if(a.missing) return `<div class="u-agent">${head}</div>`;
      const wins = (a.windows||[]).map(w => {
        const cls = w.state === "超速" ? "hot" : w.state === "略快" ? "warn" : "";
        const tick = ((w.elapsed != null) ? `<span class="u-tick" style="left:calc(${Math.min(100,w.elapsed)}% - 1px)"></span>` : "") +
          ((w.goal != null) ? `<span class="u-goal" title="${esc(w.goal_label || "目標")}：現在該用到 ${w.goal}%" style="left:calc(${Math.min(100,w.goal)}% - 1px)"></span>` : "");
        const right = w.count ? w.count : `${Math.round(w.used)}%`;
        const sub = [w.state && w.state !== "正常" ? w.state : "", w.empty_at ? `約 ${esc(whenStr(w.empty_at))} 用完` : "",
                     w.goal != null ? `${esc(w.goal_label || "目標")}：該到 ${Math.round(w.goal)}%（虛線）` : "",
                     w.resets ? `${esc(w.resets)} 重置` : ""].filter(Boolean).join("・");
        return `<div class="u-win"><div class="u-row"><span>${esc(w.label)}</span><b>${right}</b></div>
          <div class="u-bar"><div class="u-fill ${cls}" style="width:${Math.min(100,w.used)}%"></div>${tick}</div>
          <div class="u-row"><span>${sub}</span></div></div>`;
      }).join("");
      const hot = /超速|要省/.test(a.verdict||"");
      return `<div class="u-agent">${head}${wins}<div class="u-verdict ${hot?"hot":""}">${esc(a.verdict||"")}</div></div>`;
    }).join("");
  }catch(e){ $("#usageList").textContent = "讀不到用量"; }
}
$("#usageBtn").onclick = () => $("#usage").classList.toggle("open");
$("#marksBtn").onclick = () => $("#marks").classList.toggle("open");
(() => {   // 使用者 11-20 01:11：書籤列可縮小，擋到也不影響；記住狀態
  const m = $("#marks"), b = $("#marksMin");
  const set = on => { m.classList.toggle("mini", on); b.textContent = on ? "＋" : "－"; try{ localStorage.setItem("rt-marks-mini", on ? "1" : "0"); }catch(e){} };
  let on = false; try{ on = localStorage.getItem("rt-marks-mini") === "1"; }catch(e){}
  set(on); b.onclick = () => set(!m.classList.contains("mini"));
})();
(() => { let f = false; try{ f = localStorage.getItem("rt-fold") === "1"; }catch(e){}
  document.body.classList.toggle("fold", f); $("#foldBtn").textContent = f ? "↕ 展開" : "↕ 收合";
  $("#foldBtn").onclick = () => { const on = document.body.classList.toggle("fold");
    $("#foldBtn").textContent = on ? "↕ 展開" : "↕ 收合"; try{ localStorage.setItem("rt-fold", on ? "1" : "0"); }catch(e){} }; })();
loadMarks();
loadUsage(); setInterval(loadUsage, 60000);
let uiVer = 0;  // 第一次載入時的網頁版本
$("#updBtn").onclick = () => location.reload();
let pollSeq = 0;
async function poll(){
  const seq = ++pollSeq;
  try{
    const asked = room;
    const d = await api(`/api/poll?room=${encodeURIComponent(room)}&since=${total}&epoch=${epoch}`);
    if(asked !== room || seq !== pollSeq) return;  // 舊的回應（切換房間或重疊）直接丟掉
    if(d.room !== room){ room = d.room; }
    renderRooms(d.rooms);
    (d.rooms || []).forEach(r => roomNames[r.id] = r.name);
    if(soloSetFor !== room){  // 剛進這個房間：一對一房預設選那一位，其他房回到「問大家」
      const me = (d.rooms||[]).find(r => r.id === room);
      if(me){ pickTarget(me.solo || "both"); soloSetFor = room; box.blur(); }
    }
    const nearBottom = main.scrollHeight - main.scrollTop - main.clientHeight < 120;
    if(d.reset){ list.innerHTML = ""; total = 0; }
    epoch = d.epoch;
    if(d.ui_ver){ if(!uiVer) uiVer = d.ui_ver; else if(d.ui_ver !== uiVer) $("#updBtn").hidden = false; }
    if(thinkingEl){ thinkingEl.remove(); thinkingEl = null; }
    if(d.total === 0 && !list.querySelector(".msg")) showEmpty();
    else if(d.messages.length){ const e = list.querySelector(".empty"); if(e) e.remove(); }
    if(d.start > 0 && !list.querySelector(".msg") && !list.querySelector(".older")){
      const o = document.createElement("div"); o.className = "older";
      o.textContent = `較早的 ${d.start} 則已收起（完整紀錄在 logs 資料夾）`;
      list.appendChild(o);
    }
    d.messages.forEach((m, i) => appendMsg(m, d.start + i));
    total = d.start + d.messages.length;
    const msgs = list.querySelectorAll(".msg");  // 畫面上最多留 300 則，太舊的移掉
    for(let i = 0; i < msgs.length - 300; i++) msgs[i].remove();
    busy = d.busy;
    setThinking(d.progress);
    const st = $("#st");
    st.className = "pill" + (busy ? " busy" : " on");
    st.lastChild.textContent = busy ? d.status : "就緒";
    const tg = $("#tg"), t = d.telegram;
    if(!t.ok){ tg.className = "pill warn"; tg.lastChild.textContent = "Telegram 連線中"; }
    else if(!t.paired){ tg.className = "pill warn"; tg.lastChild.textContent = `Telegram 未配對：私訊 @${t.bot} 傳 /pair ${t.pair_code}`; }
    else { tg.className = "pill on"; tg.lastChild.textContent = t.linked ? "本房已連到 Telegram" : "本房沒有連到 Telegram"; if(!t.linked) tg.className = "pill"; }
    const w = $("#write"); w.checked = d.write;
    $("#writeLbl").textContent = d.write ? "可寫檔" : "唯讀";
    w.parentElement.classList.toggle("rw", d.write);
    $("#st").title = d.terminal ? "Claude 由終端機的 Claude Code 回覆" : "終端機不在，Claude 由備援回覆";
    const bad = Object.entries(d.health || {}).filter(([k, v]) => !v.ok);
    const hp = $("#health");
    hp.hidden = !bad.length;
    if(bad.length){ hp.textContent = "⚠ " + bad.map(([k, v]) => `${k}：${v.msg}`).join("；"); hp.title = hp.textContent; }
    const ap = $("#approval");
    if(d.approval){
      if(ap.dataset.id !== d.approval.id){
        ap.dataset.id = d.approval.id;
        $("#apWho").textContent = d.approval.agent;
        $("#apItems").innerHTML = d.approval.items.map(t => `<li>${esc(t)}</li>`).join("");
        $("#apAlways").hidden = !d.approval.always_ok;
      }
      ap.hidden = false;
    } else { ap.hidden = true; ap.dataset.id = ""; }
    $("#order").textContent = d.order === "claude" ? "Claude 先講" : "Codex 先講";
    $("#more").disabled = busy || d.total === 0;
    $("#stop").disabled = !busy;
    $("#new").disabled = busy;
    if(d.messages.length && nearBottom) main.scrollTop = main.scrollHeight;
  }catch(e){
    const st = $("#st"); st.className = "pill warn"; st.lastChild.textContent = "中樞沒有回應（黑色視窗被關了嗎？）";
  }
}
async function send(){
  const text = box.value.trim();
  if(!text) return;
  box.value = ""; grow();
  await api("/api/send", {text, target, room, members: groupMembers()});
  setTimeout(()=>main.scrollTop = main.scrollHeight, 300);
}
function grow(){ box.style.height = "auto"; box.style.height = Math.min(box.scrollHeight, innerHeight*0.4) + "px"; }
box.addEventListener("input", grow);
box.addEventListener("keydown", e => {
  if(e.key === "Enter" && !e.shiftKey && !e.isComposing && e.keyCode !== 229){ e.preventDefault(); send(); }
});
$("#send").onclick = send;
function pickTarget(t){  // 程式切換下方按鈕（一對一房預設選那一位；之後照樣可以手動換）
  const b = document.querySelector(`#target button[data-t="${t}"]`);
  if(b) b.onclick();
}
let soloSetFor = null;
// 「群聊」名單：每個「只問 X」右邊的小按鈕決定 X 在不在「問大家」裡（存在這台瀏覽器）
const GROUP_ORDER = ["claude", "codex", "gemini", "nvidia", "deepseek", "dot"];
const GROUP_NAME = {claude:"Claude", codex:"Codex", gemini:"Gemini", nvidia:"輝達", deepseek:"DeepSeek", dot:"Dot"};
let group = {claude:true, codex:true, gemini:true, nvidia:false, deepseek:false, dot:false};
try{ Object.assign(group, JSON.parse(localStorage.getItem("rt-group") || "{}")); }catch(e){}
function groupMembers(){ return GROUP_ORDER.filter(k => group[k]); }
function renderGroup(){
  document.querySelectorAll("#target button.skip").forEach(s => {
    const k = s.dataset.a, on = group[k];
    s.classList.toggle("off", !on);
    s.textContent = on ? "群" : "略";
    s.title = on ? `${GROUP_NAME[k]} 在「問大家」名單裡；點一下改成群聊跳過` : `群聊跳過 ${GROUP_NAME[k]}；點一下加回「問大家」`;
  });
  const all = document.querySelector('#target button[data-t="both"]');
  const names = groupMembers().map(k => GROUP_NAME[k]);
  if(all){ all.textContent = `問大家（${names.length}）`; all.title = "會問：" + (names.join("、") || "（沒人，改問 Claude）"); }
}
for(const k of GROUP_ORDER){
  const b = document.querySelector(`#target button[data-t="${k}"]`);
  if(!b) continue;
  const s = document.createElement("button");
  s.className = "skip"; s.dataset.a = k;
  s.onclick = e => { e.stopPropagation(); group[k] = !group[k];
    try{ localStorage.setItem("rt-group", JSON.stringify(group)); }catch(err){} renderGroup(); };
  b.after(s);
}
renderGroup();  // 這個房間已經套用過預設對象，就不再蓋掉使用者自己的選擇
document.querySelectorAll("#target button:not(.skip)").forEach(b => b.onclick = () => {
  target = b.dataset.t;
  $("#target").classList.toggle("solo-mode", target !== "both");
  box.placeholder = target === "note" ? "只記下，不會叫醒他們…（Enter 送出）" : "輸入訊息…（Enter 送出，Shift+Enter 換行）";
  document.querySelectorAll("#target button:not(.skip)").forEach(x => x.classList.toggle("sel", x === b));
  box.focus();
});
$("#write").onchange = e => api("/api/write", {on: e.target.checked});
// 使用者 11-20 00:46：待討論／研究／變動不要開新分頁，放右邊、切換型
const SIDE_PAGES = {decide: ["待討論", "/decisions"], research: ["研究", "/research"], changes: ["變動", "/changes"], settings: ["設定", "/settings"]};   // 中文路徑瀏覽器會編碼成 %E5…，中樞比不到（網頁巡檢員 11-20 抓到）
function openSide(name, hash, keep){
  const pane = $("#sidePane"), k = encodeURIComponent(new URLSearchParams(location.search).get("k") || "");
  if(hash){   // 定位到某一列（本房設定）
    const ex = pane.querySelector(`iframe[data-p="${name}"]`);
    if(ex){ try{ ex.contentWindow.location.hash = hash; }catch(e){} }
    else setTimeout(() => { const f = pane.querySelector(`iframe[data-p="${name}"]`); if(f) f.onload = () => { try{ f.contentWindow.location.hash = hash; }catch(e){} }; }, 0);
  }
  if(pane.dataset.cur === name && !pane.hidden && !keep){ pane.hidden = true; document.body.classList.remove("side-open", "side-max"); return; }
  pane.hidden = false; pane.dataset.cur = name; document.body.classList.add("side-open");
  pane.querySelectorAll(".side-tabs button[data-p]").forEach(b => b.classList.toggle("sel", b.dataset.p === name));
  // Codex 00:47：切換會重載、草稿消失 → 每頁一個 iframe，只切換顯示，寫到一半的留言保留
  pane.querySelectorAll("iframe").forEach(x => x.hidden = x.dataset.p !== name);
  let f = pane.querySelector(`iframe[data-p="${name}"]`);
  if(!f){ f = document.createElement("iframe"); f.dataset.p = name; f.className = "sideFrame"; f.src = SIDE_PAGES[name][1] + "?k=" + k; pane.appendChild(f); }
}
for(const n of Object.keys(SIDE_PAGES)){ const b = document.getElementById(n); if(b) b.onclick = () => openSide(n); }
document.querySelectorAll("#sidePane .side-tabs button[data-p]").forEach(b => b.onclick = () => openSide(b.dataset.p));
$("#sideClose").onclick = () => { $("#sidePane").hidden = true; document.body.classList.remove("side-open", "side-max"); };
$("#sideMax").onclick = () => document.body.classList.toggle("side-max");
(() => {   // 拖曳中間的條調整左右寬度，記在這台瀏覽器
  const root = document.documentElement, grip = $("#sideGrip");
  try{ const w = +localStorage.getItem("rt-sidew"); if(w >= 320) root.style.setProperty("--sidew", w + "px"); }catch(e){}
  grip.onmousedown = e => {
    e.preventDefault(); grip.classList.add("drag"); document.body.classList.add("dragging");
    const move = ev => { const w = Math.max(320, Math.min(window.innerWidth - 360, window.innerWidth - ev.clientX));
                         root.style.setProperty("--sidew", w + "px"); };
    const up = () => { document.removeEventListener("mousemove", move); document.removeEventListener("mouseup", up);
                       grip.classList.remove("drag"); document.body.classList.remove("dragging");
                       try{ localStorage.setItem("rt-sidew", parseInt(getComputedStyle(root).getPropertyValue("--sidew"))); }catch(e){} };
    document.addEventListener("mousemove", move); document.addEventListener("mouseup", up);
  };
})();
$("#sideReload").onclick = () => { const f = $("#sidePane").querySelector(`iframe[data-p="${$("#sidePane").dataset.cur}"]`); if(f) f.src = f.src; };
$("#apAllow").onclick = () => { $("#approval").hidden = true; api("/api/approve", {allow: true, room}); };
$("#apAlways").onclick = () => { $("#approval").hidden = true; api("/api/approve", {allow: true, always: true, room}); };
$("#apDeny").onclick = () => { $("#approval").hidden = true; api("/api/approve", {allow: false, room}); };
$("#order").onclick = () => api("/api/order", {room});
$("#more").onclick = () => api("/api/more", {n: +$("#rounds").value, room});
$("#stop").onclick = () => api("/api/stop", {room});
$("#new").onclick = () => {
  const b = $("#new");
  if(Date.now() - confirmNew > 3000){ confirmNew = Date.now(); b.textContent = "再按一次確認"; setTimeout(()=>b.textContent="新討論", 3000); return; }
  b.textContent = "新討論"; api("/api/new", {room});
};
async function loop(){ await poll(); setTimeout(loop, 1200); }
loop(); box.focus();
</script>
